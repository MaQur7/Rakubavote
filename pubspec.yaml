name: rakubavote
description: "Rakubavote: offline-first voting platform for South Sudan."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  csv: ^8.0.0
  drift: ^2.35.3
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.3
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.8.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
